<div class="mainpage">
  <section class="hero">
    <h1>Welcome to {{ site_name }}</h1>
    <p class="hero-sub">{{ tagline }} · <b>{{ count }}</b> articles</p>
    <form class="hero-search" action="{{ root }}/search/" role="search">
      <input type="search" name="q" placeholder="Search for a reagent, reaction or topic" aria-label="Search">
      <button type="submit">Search</button>
    </form>
  </section>

  <div class="mp-intro">{{ intro }}</div>

  <div class="mp-grid">
    <section class="card card-featured">
      <h2 class="card-title">Featured article: {{ featured_title }}</h2>
      <div class="card-body">{{ featured }}</div>
    </section>
    <section class="card card-recent">
      <h2 class="card-title">Recently updated</h2>
      <div class="card-body"><ul class="plain-list">{{ recent }}</ul></div>
    </section>
  </div>

  <section class="card card-cats">
    <h2 class="card-title">Browse by category</h2>
    <div class="card-body"><ul class="chip-list">{{ categories }}</ul></div>
  </section>
</div>
