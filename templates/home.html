<div class="mainpage">
  <div id="mp-welcome">
    <h1>Welcome to <a href="{{ root }}/">{{ site_name }}</a></h1>
    <p>{{ tagline }}. <b>{{ count }}</b> articles so far.</p>
  </div>
  <div class="mp-intro">{{ intro }}</div>
  <div class="mp-columns">
    <section class="mp-box mp-featured">
      <h2>Featured article: {{ featured_title }}</h2>
      <div class="mp-box-body">{{ featured }}</div>
    </section>
    <section class="mp-box mp-recent">
      <h2>Recently updated</h2>
      <div class="mp-box-body"><ul>{{ recent }}</ul></div>
    </section>
  </div>
  <section class="mp-box mp-cats">
    <h2>Browse by category</h2>
    <div class="mp-box-body"><ul class="columns">{{ categories }}</ul></div>
  </section>
</div>
